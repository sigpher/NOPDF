android {
    compileSdkVersion 29

    resourcePrefix 'app'
    defaultConfig {
        applicationId "com.sigpher.nopdf"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 16
        versionName "0.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        // App 只声明了英文与中文（简/繁），但依赖库（appcompat/material/umeng 等）自带上百种
        // 语言的字符串，全部打进 resources.arsc 会白白多占几百 KB。这里按实际支持的语言白名单
        // 过滤；只列语言不列密度，因此各密度图片不受影响。
        resConfigs 'en', 'zh-rCN', 'zh-rHK', 'zh-rMO', 'zh-rSG', 'zh-rTW'
    }

    // 按 ABI 拆包：每个 APK 只带一个 ABI 的 native 库。native 库（MuPDF 的
    // libmupdf_java.so）压缩后约占包体 60%，是最大的单项；拆开后每个包
    // 只保留自己那一份，单包可省下约 0.8MB（arm64）。
    //
    // 原先是用 defaultConfig.ndk.abiFilters 做过滤——那只决定"哪些 ABI 进包"，两个 ABI 仍然
    // 打进同一个 APK。这里改用 splits.abi 真正按 ABI 输出多个 APK，并把 universalApk 关掉
    // （不再产出同时含两个 ABI 的通用包）。'armeabi'(ARMv5) 与 x86/x86_64 均不产出。
    splits {
        abi {
            enable true
            reset() // 清掉 AGP 的默认 ABI 列表，只保留下面 include 的两个
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    signingConfigs {
        Properties properties = new Properties()
        InputStream inputStream = project.rootProject.file('local.properties').newDataInputStream()
        properties.load(inputStream)
        release {
            storeFile file(properties.getProperty("STORE_FILE_NAME"))
            storePassword properties.getProperty("KEYSTORE_PASSWORD")
            keyAlias properties.getProperty("STORE_ALIAS")
            keyPassword properties.getProperty("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
            manifestPlaceholders = [
                    app_icon      : '@mipmap/app_ic_launcher',
                    app_icon_round: '@mipmap/app_ic_launcher_round',
                    app_name      : '@string/app_name_en'
            ]
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            applicationIdSuffix '.dev'
            manifestPlaceholders = [
                    app_icon      : '@mipmap/app_ic_launcher_dev',
                    app_icon_round: '@mipmap/app_ic_launcher_round_dev',
                    app_name      : '@string/app_name_dev'
            ]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
}

greendao {
    schemaVersion 3 // 数据库版本号
    daoPackage 'com.sigpher.nopdf.common.greendao' // 设置 DaoMaster、DaoSession、Dao包名
    targetGenDir 'src/main/java' // 设置DaoMaster、DaoSession、Dao目录
    // targetGenDirTest：设置生成单元测试目录
    // generateTests：设置自动生成单元测试用例
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    implementation project(':android-pdf-viewer')
    // base 的 http / webview / download / timer 能力簇在本应用中完全没有被引用（app 只用到
    // base 的 BaseActivity/BaseFragment/ImageLoader/DefaultOption/OnClickListenerImpl/
    // TextWatcherImpl/StatusBarUtils）。已通过字节码反向引用确认这些类都是自闭环、不会被
    // 任何被使用到的类触达，因此排除其传递依赖以减小包体。
    implementation('com.aaron:base:1.1.5-beta9') {
        exclude group: 'com.squareup.retrofit2'
        exclude group: 'com.squareup.okhttp3'
        exclude group: 'com.tencent.sonic'
        exclude group: 'com.liulishuo.okdownload'
        exclude group: 'io.reactivex.rxjava2'
        exclude group: 'com.uber.autodispose'
    }
    implementation 'org.greenrobot:greendao:3.2.2'
    implementation 'com.github.anzewei:parallaxbacklayout:1.1.9'
    implementation 'com.github.mmin18:realtimeblurview:1.2.1'
    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
//    implementation 'com.tencent.bugly:crashreport_upgrade:1.4.0'
//    implementation 'com.tencent.bugly:nativecrashreport:3.7.1'
//    implementation 'com.tencent.tinker:tinker-android-lib:1.9.9'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.6.3'
    releaseImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.6.3'
    implementation "androidx.core:core-ktx:1.3.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.2'

    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.46'
//    implementation 'io.github.yuweiguocn:GreenDaoUpgradeHelper:v2.2.1'

    implementation  'com.umeng.umsdk:common:9.1.0' // (必选)
    implementation  'com.umeng.umsdk:asms:1.1.3' // asms包依赖(必选)
    implementation 'com.umeng.umsdk:crash:0.0.4' // native crash包依赖(必选)
    implementation  'com.umeng.umsdk:oaid_lenovo:1.0.0' // (可选)
    implementation  'com.umeng.umsdk:oaid_mi:1.0.0' // (可选)
    implementation  'com.umeng.umsdk:oaid_oppo:1.0.4' // (可选)
    implementation  'com.umeng.umsdk:oaid_vivo:1.0.0.1' // (可选)
}
repositories {
    mavenCentral()
}
