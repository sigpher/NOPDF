apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'org.greenrobot.greendao'

//apply plugin: 'bugly'
////apply from: 'tinker-support.gradle'A
//// 上传符号表插件
